<div class="dashboard-container" fxLayout="column" fxLayoutGap="50px">

    <!-- Stats Cards Section -->
    <div class="stats-section">
        <h2 class="section-title">Dashboard Overview</h2>
        <div fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="start stretch">

            <!-- Client Leads Card -->
            <div fxFlex="100%" fxFlex.gt-sm="calc(50% - 12px)" fxFlex.gt-md="calc(33.33% - 12px)">
                <mat-card class="stat-card client-leads">
                    <mat-card-header>
                        <div mat-card-avatar class="card-avatar primary-bg">
                            <mat-icon>group_add</mat-icon>
                        </div>
                        <mat-card-title class="card-title">New Clients</mat-card-title>
                        <mat-card-subtitle class="card-subtitle">This month</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content class="stat-content">
                        <div class="stat-number">

                        </div>
                        <div class="stat-growth">
                            <mat-icon>trending_up</mat-icon>
                            <span>%</span>
                        </div>

                    </mat-card-content>
                    <mat-card-actions class="card-actions">
                        <button mat-button color="primary">
                            <mat-icon>visibility</mat-icon>
                            View Details
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>

            <!-- Employee Leads Card -->
            <div fxFlex="100%" fxFlex.gt-sm="calc(50% - 12px)" fxFlex.gt-md="calc(33.33% - 12px)">
                <mat-card class="stat-card employee-leads">
                    <mat-card-header>
                        <div mat-card-avatar class="card-avatar warn-bg">
                            <mat-icon>badge</mat-icon>
                        </div>
                        <mat-card-title class="card-title">New Employees</mat-card-title>
                        <mat-card-subtitle class="card-subtitle">This Month</mat-card-subtitle>
                    </mat-card-header>

                    <mat-card-content class="stat-content">
                        <div class="stat-number">

                        </div>

                        <div class="stat-growth">
                            <mat-icon>trending_up</mat-icon>
                            <span>
                                % </span>
                        </div>
                    </mat-card-content>

                    <mat-card-actions class="card-actions">
                        <button mat-button color="warn">
                            <mat-icon>visibility</mat-icon>
                            View Details
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>


            <!-- Total Earnings Card -->
            <div fxFlex="100%" fxFlex.gt-sm="calc(50% - 12px)" fxFlex.gt-md="calc(33.33% - 12px)">
                <mat-card class="stat-card earnings">
                    <mat-card-header>
                        <div mat-card-avatar class="card-avatar accent-bg">
                            <mat-icon>account_balance_wallet</mat-icon>
                        </div>
                        <mat-card-title class="card-title">Total Earnings</mat-card-title>
                        <mat-card-subtitle class="card-subtitle">All time rewards</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content class="stat-content">
                        <div class="stat-number earnings-amount" >
                            <span class="currency">₹</span>
                        </div>
                        <div class="stat-growth positive">
                            <mat-icon>trending_up</mat-icon>
                            <span>+%</span>
                        </div>
                    </mat-card-content>
                    <mat-card-actions class="card-actions">
                        <button mat-button color="accent">
                            <mat-icon>payment</mat-icon>
                            View Earnings
                        </button>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </div>

    <!-- Optional: Quick Actions Section -->
    <div class="quick-actions-section">
        <h3 class="section-title">Quick Actions</h3>
        <div fxLayout="row wrap" fxLayoutGap="12px">
            <button mat-raised-button color="primary" class="action-btn">
                <mat-icon>person_add</mat-icon>
                Add Client Lead
            </button>
            <button mat-raised-button color="warn" class="action-btn">
                <mat-icon>work</mat-icon>
                Add Employee Lead
            </button>
            <button mat-stroked-button color="accent" class="action-btn">
                <mat-icon>analytics</mat-icon>
                View Reports
            </button>
        </div>
    </div>
</div>

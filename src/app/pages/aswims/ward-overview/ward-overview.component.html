<div class="overview-wrapper">
    <div class="header-section">
        <div class="title-group">
            <h2>Acute Surgical Ward</h2>
            <span class="count-badge">{{ filteredPatients.length }} Patients</span>
        </div>

        <mat-form-field appearance="outline" class="search-box">
            <mat-label>Search Bed or Name</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search...">
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>

    <div class="patient-grid" *ngIf="!isLoading">
        <mat-card *ngFor="let patient of filteredPatients" class="patient-card admitted">
            <div class="bed-chip">
                <span class="prefix">Bed No:</span>
                <span class="number">{{ patient.bed_no }}</span>
            </div>

            <mat-card-header>
                <mat-card-title>{{ patient.name }}</mat-card-title>
                <mat-card-subtitle>Admitted: {{ patient.doa | date:'dd/MM/yyyy' }}</mat-card-subtitle>
            </mat-card-header>

            <mat-card-content>
                <div class="diagnosis-brief">
                    <small>DIAGNOSIS</small>
                    <p>{{ patient.diagnosis }}</p>
                </div>
            </mat-card-content>

            <mat-card-actions align="end">
                <button mat-icon-button color="accent" (click)="onAddVitals(patient)" matTooltip="Record Vitals">
                    <mat-icon>monitor_heart</mat-icon>
                </button>

                <button mat-button color="primary" (click)="onEdit(patient)"
                    matTooltip="Add Clinical Notes">EDIT</button>

                <button mat-icon-button [matMenuTriggerFor]="menu" [matMenuTriggerData]="{p: patient}">
                    <mat-icon>more_vert</mat-icon>
                </button>
            </mat-card-actions>
        </mat-card>
    </div>

    <mat-menu #menu="matMenu">
        <ng-template matMenuContent let-patient="p">
            <button mat-menu-item (click)="onViewHistory(patient)">
                <mat-icon color="primary">history</mat-icon>
                <span>View Clinical History</span>
            </button>
        </ng-template>
    </mat-menu>

    <div class="loader-container" *ngIf="isLoading">
        <mat-spinner diameter="40"></mat-spinner>
    </div>
</div>

<div class="login-container">
    <mat-toolbar class="navbar">
        <a class="logo" [href]="staticWebsiteUrl">
            <img src="assets/img/logo/logo.jpeg" alt="POTHANSAI Logo">
            <span class="logo-text">PothansAI</span>
        </a>
        <span class="flex-spacer"></span>
        <a mat-icon-button class="logo-mobile" [href]="staticWebsiteUrl" color="primary">
            <mat-icon>home</mat-icon>
        </a>
    </mat-toolbar>

    <div class="login-card mat-elevation-z12">
        <div class="login-header">
            <div class="logo-icon">
                <mat-icon>lock</mat-icon>
            </div>
            <h2>{{userType | lowercase}} Login</h2>
        </div>

        <div class="login-content">
            <form [formGroup]="form" (ngSubmit)="onSubmit(form.value)">
                <mat-form-field appearance="outline" class="w-100 form-field">
                    <mat-label>Email Address</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="Enter your email">
                    <mat-icon matPrefix>email</mat-icon>
                    <mat-error *ngIf="form.controls.email.errors?.required">Email is required</mat-error>
                    <mat-error *ngIf="form.controls.email.hasError('invalidEmail')">Invalid email address</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100 form-field">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" [type]="hide ? 'password' : 'text'"
                        placeholder="Enter your password">
                    <mat-icon matPrefix>lock</mat-icon>
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide" type="button">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="form.controls.password.errors?.required">Password is required</mat-error>
                    <mat-error *ngIf="form.controls.password.hasError('minlength')">
                        Password must be at least 6 characters
                    </mat-error>
                </mat-form-field>

                <div class="login-actions">
                    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
                        {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
                    </button>
                    <button mat-button type="button" class="forgot-btn" (click)="forgotPwd()" [disabled]="loading">
                        Forgot Password?
                    </button>
                </div>

                <div class="signup-footer">
                    <span>Don't have an account? </span>
                    <a [routerLink]="['/register', userType.toLowerCase()]">Sign up now!</a>
                </div>
            </form>
        </div>
    </div>
</div>

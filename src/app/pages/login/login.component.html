<div class="min-h-screen bg-slate-900 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black flex items-start sm:items-center justify-center pt-28 pb-10 px-4 sm:p-6">
    <nav class="fixed top-0 left-0 right-0 bg-white/10 backdrop-blur-md border-b border-white/10 z-50 px-6 py-3 flex items-center justify-between shadow-lg">
        <a class="flex items-center gap-3 no-underline" [href]="staticWebsiteUrl">
            <img src="assets/img/logo/logo.jpeg" alt="POTHANSAI Logo" class="h-10 w-auto rounded-lg shadow-sm">
            <span class="text-xl font-bold text-white tracking-wide">PothansAI</span>
        </a>
        <a mat-icon-button [href]="staticWebsiteUrl" class="text-white">
            <mat-icon>home</mat-icon>
        </a>
    </nav>

    <div class="w-full max-w-md bg-white rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/20 overflow-hidden transform transition-all duration-500 hover:shadow-[0_20px_60px_rgba(0,0,0,0.6)]">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-center relative overflow-hidden">
            <div class="absolute inset-0 bg-white/10 backdrop-blur-sm"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mx-auto mb-4 border border-white/40 shadow-[0_0_15px_rgba(255,255,255,0.4)] hover:shadow-[0_0_30px_rgba(255,255,255,0.8)] hover:scale-110 hover:bg-white/30 transition-all duration-500 group cursor-pointer">
                    <mat-icon class="text-white text-3xl h-8 w-8 drop-shadow-[0_0_8px_rgba(255,255,255,0.8)] group-hover:scale-110 transition-transform duration-500">lock</mat-icon>
                </div>
                <h2 class="m-0 font-semibold text-white tracking-wide text-2xl drop-shadow-md">
                    {{ userType === 'EMPLOYEE' ? 'Hero' : 'Legends' }} Login
                </h2>
            </div>
        </div>

        <div class="p-8 sm:p-10 bg-white">
            <form [formGroup]="form" (ngSubmit)="onSubmit(form.value)" class="flex flex-col gap-2">
                <mat-form-field appearance="outline" class="w-full transform transition-all duration-300 hover:-translate-y-1 hover:shadow-md focus-within:-translate-y-1 focus-within:shadow-md rounded-xl bg-white">
                    <mat-label>Email Address</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="Enter your email">
                    <mat-icon matPrefix class="text-gray-400 mr-2">email</mat-icon>
                    <mat-error *ngIf="form.controls.email.errors?.required">Email is required</mat-error>
                    <mat-error *ngIf="form.controls.email.hasError('invalidEmail')">Invalid email address</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full transform transition-all duration-300 hover:-translate-y-1 hover:shadow-md focus-within:-translate-y-1 focus-within:shadow-md rounded-xl bg-white">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" [type]="hide ? 'password' : 'text'" placeholder="Enter your password">
                    <mat-icon matPrefix class="text-gray-400 mr-2">lock</mat-icon>
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" type="button">
                        <mat-icon class="text-gray-500">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="form.controls.password.errors?.required">Password is required</mat-error>
                    <mat-error *ngIf="form.controls.password.hasError('minlength')">
                        Password must be at least 6 characters
                    </mat-error>
                </mat-form-field>

                <div class="mt-4 flex flex-col gap-4">
                    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading" class="w-full py-6 text-lg rounded-xl shadow-md hover:shadow-lg transition-all duration-300">
                        {{ loading ? 'SIGNING IN...' : 'SIGN IN' }}
                    </button>
                    <button mat-button type="button" class="text-indigo-600 hover:text-indigo-800 font-medium transition-colors" (click)="forgotPwd()" [disabled]="loading">
                        Forgot Password?
                    </button>
                </div>

                <div class="text-center mt-8 pt-6 border-t border-gray-100">
                    <span class="text-gray-500">Don't have an account? </span>
                    <a [routerLink]="['/register', userType.toLowerCase()]" class="text-indigo-600 font-semibold hover:text-indigo-800 transition-colors ml-1">Sign up now!</a>
                </div>
            </form>
        </div>
    </div>
</div>

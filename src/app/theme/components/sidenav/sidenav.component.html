<mat-toolbar color="primary" 
    class="sidenav-header flex items-center justify-center">
    <div class="header-container flex items-center w-full" 
        [class.justify-between]="settings.menuType != 'mini'"
        [class.justify-center]="settings.menuType == 'mini'">
        <a mat-raised-button color="accent" (click)="closeSubMenus()" class="small-logo">P</a>
        <a *ngIf="settings.menuType == 'default'" class="logo" (click)="closeSubMenus()">
            {{ serviceName === 'Prabha Analytics' ? 'PRABHA' : 'POTHANSAI' }}
        </a>
        <svg *ngIf="settings.menuType != 'mini'" class="pin" (click)="settings.sidenavIsPinned = !settings.sidenavIsPinned">
            <path *ngIf="!settings.sidenavIsPinned" d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z" />
            <path *ngIf="settings.sidenavIsPinned"
                d="M2,5.27L3.28,4L20,20.72L18.73,22L12.8,16.07V22H11.2V16H6V14L8,12V11.27L2,5.27M16,12L18,14V16H17.82L8,6.18V4H7V2H17V4H16V12Z" />
        </svg>
    </div>
</mat-toolbar>

<div class="dashboard-context-switcher" *ngIf="hasAdminRole() && settings.menuType != 'mini'">
    <mat-button-toggle-group [value]="dashboardModeService.currentMode"
        (change)="dashboardModeService.setMode($event.value)" 
        class="sidebar-switcher flex items-center justify-center">
        <mat-button-toggle value="admin" class="flex-1" matTooltip="Admin Overview">
            <div class="toggle-content flex items-center justify-center gap-2">
                <mat-icon>admin_panel_settings</mat-icon>
                <span>Admin</span>
            </div>
        </mat-button-toggle>
        <mat-button-toggle value="employee" class="flex-1" matTooltip="Employee Workspace">
            <div class="toggle-content flex items-center justify-center gap-2">
                <mat-icon>dashboard</mat-icon>
                <span>Staff</span>
            </div>
        </mat-button-toggle>
    </mat-button-toggle-group>
</div>

<div class="user-block transition-all duration-300 flex flex-col items-center"
    [class.show]="settings.sidenavUserBlock">
    
    <div class="user-main-info flex items-center justify-center w-full px-4 gap-4 py-4">
        <div class="avatar-wrapper relative">
            <img [src]="userImage" alt="user-image" class="avatar-img shadow-lg">
        </div>
        
        <div class="user-details flex flex-col" *ngIf="settings.menuType != 'mini'">
            <p class="name font-bold leading-tight">{{userName}}</p>
            <p class="dept text-sm opacity-80">{{deptName}}</p>
        </div>
    </div>
    
    <div class="logout-section w-full flex justify-center pb-4" *ngIf="settings.menuType != 'mini'">
        <button mat-icon-button (click)="logout()" class="logout-btn" matTooltip="Sign Out">
            <mat-icon>power_settings_new</mat-icon>
        </button>
    </div>
</div>

<perfect-scrollbar class="sidenav-menu-outer flex-grow" [class.user-block-show]="settings.sidenavUserBlock">
    <div id="vertical-menu">
        <app-vertical-menu [menuItems]="menuItems" [menuParentId]="null"></app-vertical-menu>
    </div>
</perfect-scrollbar>

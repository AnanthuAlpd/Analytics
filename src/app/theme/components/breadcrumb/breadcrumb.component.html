<div class="px-4 md:px-8 py-3 bg-surface-50/50 w-full overflow-hidden" *ngIf="router.url != '/' && router.url != '/dashboard'">
    <nav class="flex items-center w-full sm:w-fit bg-white shadow-premium border border-slate-100 rounded-2xl overflow-x-auto no-scrollbar select-none" 
         aria-label="Breadcrumb">
        
        <!-- 🏠 Home Block -->
        <div class="flex items-center gap-2 px-3 sm:px-4 py-2 text-slate-400 border-r border-slate-50 bg-slate-50/30 shrink-0">
            <mat-icon class="!text-lg !w-5 !h-5">home</mat-icon>
            <span class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest hidden xs:inline">Home</span>
        </div>

        <!-- 🛤️ Path Segments -->
        <div *ngFor="let breadcrumb of breadcrumbs; let i = index; let last = last" 
             class="flex items-center shrink-0">
            
            <!-- Parent Segment -->
            <div *ngIf="!last" 
                 class="px-3 sm:px-4 py-2 text-[9px] sm:text-[10px] font-black uppercase tracking-widest text-slate-400 border-r border-slate-50 shrink-0">
                {{ breadcrumb.name }}
            </div>

            <!-- Current Page Segment -->
            <div *ngIf="last" 
                 class="px-4 sm:px-5 py-2 text-[9px] sm:text-[10px] font-black uppercase tracking-widest text-primary bg-primary/5 shrink-0">
                <span class="flex items-center gap-1.5 sm:gap-2">
                    <div class="w-1 h-1 sm:w-1.5 sm:h-1.5 rounded-full bg-primary animate-pulse"></div>
                    {{ breadcrumb.name }}
                </span>
            </div>
        </div>
    </nav>
</div>

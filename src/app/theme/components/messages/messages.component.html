<button mat-icon-button [matMenuTriggerFor]="messagesMenu" (click)="openMessagesMenu()">
    <mat-icon [matBadge]="followUpLeads.length" [matBadgeHidden]="followUpLeads.length === 0" matBadgeColor="warn">notifications</mat-icon>
</button>
<mat-menu #messagesMenu="matMenu" [overlapTrigger]="false" class="toolbar-dropdown-menu messages">
    <!--<span (mouseleave)="onMouseLeave()">-->
        <mat-tab-group backgroundColor="primary" (click)="stopClickPropagate($event)" [selectedIndex]="selectedTab">
            
            <!-- CRM Follow-Up Leads Tab -->
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon [color]="followUpLeads.length > 0 ? 'warn' : ''" matTooltip="{{ followUpLeads.length }} Pending Actions">assignment_late</mat-icon>
                </ng-template>
                <mat-card class="content" perfectScrollbar>
                  <div fxLayout="column" fxLayoutAlign="none" class="notification-list">
                      <div class="notification-header" fxLayout="row" fxLayoutAlign="space-between center" style="padding: 10px 16px; background: #f5f5f5; border-bottom: 1px solid #eee;">
                          <span style="font-weight: 600; font-size: 13px;">Follow-up Requirements</span>
                          <span class="badge warn-badge" *ngIf="followUpLeads.length > 0">{{ followUpLeads.length }}</span>
                      </div>

                      <button mat-button *ngFor="let lead of followUpLeads" routerLink="/user-leads/emp-leads-list" class="notification-item">
                          <div fxLayout="column" fxLayoutAlign="none" class="w-100">
                              <div fxLayout="row" fxLayoutAlign="space-between start">
                                  <span class="name" style="font-weight: 600; color: #333;">{{lead.name}}</span>
                                  <span class="info"><mat-icon>phone</mat-icon> {{lead.mob_no}}</span>
                              </div>
                              <span class="text muted-text">{{lead.remarks || 'No remarks provided'}}</span>
                          </div>
                      </button>

                      <div *ngIf="followUpLeads.length === 0" style="padding: 40px 16px; text-align: center; color: #888;">
                          <mat-icon style="font-size: 40px; height: 40px; width: 40px; opacity: 0.3; margin-bottom: 10px;">check_circle_outline</mat-icon>
                          <p style="margin: 0; font-size: 14px;">Great job! No pending follow-ups.</p>
                      </div>

                      <div class="notification-footer" *ngIf="followUpLeads.length > 0" style="padding: 8px; border-top: 1px solid #eee; text-align: center;">
                          <button mat-button color="primary" routerLink="/user-leads/emp-leads-list" style="width: 100%; font-size: 12px;">
                              VIEW ALL PENDING ACTIONS
                          </button>
                      </div>
                    </div>             
                </mat-card>
            </mat-tab>

            <!-- Standard sections commented as requested -->
            <!-- 
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon>message</mat-icon>
                </ng-template>
                ...
            </mat-tab>
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon>description</mat-icon>
                </ng-template>
                ...
            </mat-tab>
            <mat-tab>
                <ng-template mat-tab-label>
                    <mat-icon>event</mat-icon>
                </ng-template>
                ...
            </mat-tab>
            -->
        </mat-tab-group>
    <!--</span>-->
</mat-menu>
